<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>REWT router — check</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
 :root{--bg:#0d1117;--fg:#e6edf3;--dim:#8b949e;--line:#30363d;--accent:#58a6ff}
 *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
   font:13px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
 #map{position:absolute;inset:0}
 #panel{position:absolute;top:0;left:0;bottom:0;width:310px;overflow-y:auto;z-index:2;
   background:rgba(13,17,23,.94);border-right:1px solid var(--line);padding:14px 16px}
 h1{font-size:14px;margin:0 0 2px} .sub{color:var(--dim);font-size:11.5px;margin-bottom:14px}
 h2{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);
   margin:16px 0 7px;border-top:1px solid var(--line);padding-top:11px}
 button{background:#161b22;color:var(--fg);border:1px solid var(--line);border-radius:5px;
   padding:5px 9px;margin:0 4px 4px 0;cursor:pointer;font:inherit;font-size:12px}
 button:hover{border-color:var(--accent)} button.on{background:var(--accent);color:#08111f;
   border-color:var(--accent);font-weight:600}
 .grp{color:#8b949e;font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin:9px 0 3px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px}
  .grp:hover{color:#c9d1d9}
  .grp.on{color:#58a6ff}
  .tick{display:inline-block;width:11px;height:11px;line-height:11px;text-align:center;border:1px solid #30363d;border-radius:3px;font-size:9px;flex:none}
  .grp.on .tick{border-color:#58a6ff}
  .keys{margin-left:17px}
  .keys.off{opacity:.32}
  .key{display:flex;align-items:center;gap:7px;margin:3px 0;font-size:12px}
 .sw{width:13px;height:13px;border-radius:3px;flex:none;border:1px solid rgba(255,255,255,.25)}
 table{width:100%;border-collapse:collapse;font-size:11.5px} td{padding:1px 0;color:var(--dim)}
 td.v{text-align:right;color:var(--fg);font-variant-numeric:tabular-nums}
 select{background:#0d1117;color:#c9d1d9;border:1px solid #30363d;border-radius:4px;padding:3px 6px;font:inherit;font-size:12px;width:100%}
  .fade{display:flex;align-items:center;gap:8px}
  .fade input{flex:1}
  #osmv{font-size:11px;color:#8b949e;width:30px;text-align:right}
  .cred{font-size:10px;color:#6e7681;margin-top:4px;line-height:1.4}
  .warn{color:#f0883e;font-size:11.5px;margin-top:8px;line-height:1.45}
 .maplibregl-popup-content{background:#161b22;color:var(--fg);font:12px system-ui;
   border:1px solid var(--line);border-radius:6px}
 .maplibregl-popup-tip{border-top-color:#161b22!important;border-bottom-color:#161b22!important}
</style></head><body>
<div id="map"></div>
<div id="panel">
  <h1>Router — check</h1>
  <div class="sub">Local instrument, not published. Coastline is OS Boundary-Line (OGL);
    depths EMODnet DTM 2024 (CC BY 4.0). <b>Not for navigation.</b></div>
  <h2>Resolution</h2>
  <select id="res"></select>
  <div class="cred" id="resnote"></div>
  <h2>Basemap</h2>
  <div class="fade"><input id="osm" type="range" min="0" max="100" step="5">
    <span id="osmv"></span></div>
  <div class="cred">&copy; OpenStreetMap contributors (ODbL). Tiles from
    openstreetmap.org, development use only.</div>
  <h2>Zoom to</h2><div id="areas"></div>
  <h2>Layers</h2><div id="legend"></div>
  <h2>Figures</h2><table id="figs"></table>
  <div class="warn" id="warn"></div>
</div>
<script>
const F='../data/', C='./';
// `hash:'map'` puts zoom/lat/lon in the URL and restores from it, so a view can be
// sent to somebody. The stage rides in the same hash under its own key.
const map=new maplibregl.Map({container:'map',center:[-3.5,54.5],zoom:4.6,hash:'map',
  style:{version:8,sources:{},layers:[{id:'bg',type:'background',paint:{'background-color':'#0d1117'}}]}});
// OSM RASTER UNDER EVERYTHING. Added once at construction, so every x- layer draw()
// adds lands on top of it; clear() only removes x- ids, so it survives a redraw.
// Development use only, and attributed in the panel: this page is gitignored and local.
map.on('load',()=>{ map.addSource('osm',{type:'raster',tiles:
    ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,maxzoom:19,
    attribution:'&copy; OpenStreetMap contributors'});
  map.addLayer({id:'osm',type:'raster',source:'osm',paint:{'raster-opacity':0}});
  applyFade(); });
map.addControl(new maplibregl.NavigationControl(),'top-right');
map.addControl(new maplibregl.ScaleControl({unit:'metric'}),'bottom-right');

const RES={3:'#f85149',4:'#f0883e',5:'#e3b341',6:'#3fb950',7:'#2ea043',8:'#58a6ff',9:'#a371f7'};
// FOUR INDEPENDENT TOGGLES, not stages. Stephen asked for the cell-centre link network
// beside the cells rather than instead of them, and once two layers can be on together
// the exclusive control is the wrong instrument: the question "does a join land on a cell
// the network actually reaches" cannot be asked one stage at a time. Declaration order is
// also PAINT order — cells beneath, joins on top.
const LAYERS={
 cells:{label:'cells', src:()=>['sl2', srcUrl(0)],
   legend:[['governed by land &gt;800 m','#f85149'],['400-800 m','#f0883e'],
     ['200-400 m','#e3b341'],['80-200 m','#3fb950'],['under 80 m','#58a6ff'],
     ['closed short hop — blind','#d29922'],['sees none','#484f58']],
   note:'Sighted sea, computed from the land outwards in 2 km reach bands. Colour is the TALLEST land that reaches each cell. Amber cells see nothing at all: they are enclosed pockets of blind water within a 3-cell hop of sighted sea, kept because a short blind hop is not a blind passage. Red water is held by a mountain; blue by a low hill, and it hugs the coast.',
   add:()=>map.addLayer({id:'x-cells',type:'fill',source:'sl2',paint:{'fill-opacity':.45,
     'fill-color':['case',['get','closed_hop'],'#d29922',
       ['!',['get','visible']],'#484f58',
       ['>=',['get','gov_h_m'],800],'#f85149',['>=',['get','gov_h_m'],400],'#f0883e',
       ['>=',['get','gov_h_m'],200],'#e3b341',['>=',['get','gov_h_m'],80],'#3fb950',
       '#58a6ff']}})},
 net:{label:'sea network', src:()=>['ed', srcUrl(1)],
   legend:[['cell-centre link','#c9d1d9'],['drawn along its res-7 path','#3fb950'],
     ['crosses a resolution band','#f0883e']],
   note:'The travelling surface: links between the centres of adjacent sea cells. AN EDGE IS AN ADJACENCY, NOT A TRACK — no vessel sailed the straight line between two hexagon centres. Aggregated to the resolution of the cells drawn beneath it, so these are not the centres a route uses either. A link CROSSES A RESOLUTION BAND where the two routing cells behind it sit at different resolutions — which happens where an estuary was refined finer, and around the closed blind hops, which are binned coarser because nothing there sees land. A seam is a place the grid changes scale. GREEN links are drawn along their actual res-7 path rather than as a straight chord, because the water between the two cell centres is narrower than the cells are wide — the north Solent, the Exe. Dropping them made the picture claim a channel was impassable when the route goes through it.',
   add:()=>{ map.addLayer({id:'x-net',type:'line',source:'ed',
       paint:{'line-width':['case',['get','crosses_band'],2.0,
                            ['==',['get','drawn_as'],'res-7 path'],1.4,0.7],
              'line-color':['case',['get','crosses_band'],'#f0883e',
                            ['==',['get','drawn_as'],'res-7 path'],'#3fb950','#c9d1d9'],
              'line-opacity':['case',['get','crosses_band'],1,0.85]}}); }},
 coast:{label:'coastal surface (res 7)', src:['cst', F+'cells_r7_coast.geojson'],
   legend:[['routing cell within 5 km of land','#1f6feb'],['its lattice','#8b949e']],
   note:'The routing cells THEMSELVES over the coastal band, at res 7, published at their own extent — which deliberately does NOT match the cells layer. The main network is clipped to the sightline cells so this toggle lines up, and that clip hides coastal surface the graph actually has. Measured against the release: 32.6% of sea entries fall in a routing cell, 39.6% one ring away, and 17.0% are absent altogether — creek heads the lattice cannot represent. This band has 32 components because a band around separate landmasses IS separate; the graph behind it is one.',
   add:async()=>{ map.addLayer({id:'x-coast-c',type:'fill',source:'cst',
       paint:{'fill-color':'#1f6feb','fill-opacity':.18,'fill-outline-color':'#388bfd'}});
     if(await src('cste', F+'edges_r7_coast.geojson'))
       map.addLayer({id:'x-coast-e',type:'line',source:'cste',
         paint:{'line-width':0.6,'line-color':'#8b949e','line-opacity':.7}}); }},
 thalnet:{label:'thalweg network — joined', src:['tnw', C+'thalweg_network.geojson'],
   legend:[['thalweg — DETECTED','#ffd479'],['bridge — INFERRED','#f85149']],
   note:'THE THALWEG CHAINS JOINED INTO A NETWORK. Each chain is a node, each short gap a candidate edge, and a minimum spanning forest picks the cheapest set that connects what it can. A bridge crossing land is refused on the 232 m mask; weight is length penalised by shallowness, so a short bridge over a bank loses to a longer one that stays in the channel. RED IS INFERENCE — a bridge is not a detected channel, it is a claim that two deep threads are usable together, and it is drawn differently so it cannot be mistaken for one. Largest component holds 68% of the chains; the rest is geography, not failure — the second largest is Norway.',
   add:()=>{ map.addLayer({id:'x-thalnet',type:'line',source:'tnw',
       filter:['==',['get','kind'],'thalweg'],
       paint:{'line-width':1.3,'line-color':'#ffd479','line-opacity':.95}});
     map.addLayer({id:'x-thalnet-b',type:'line',source:'tnw',
       filter:['==',['get','kind'],'bridge'],
       paint:{'line-width':['interpolate',['linear'],['get','km'],0.2,0.9, 2,1.6, 8,2.6],
              'line-color':'#f85149','line-opacity':.85,'line-dasharray':[2,1.5]}}); }},
 thalweg:{label:'estuary thalwegs (232 m)', src:['thl', C+'thalwegs.geojson'],
   legend:[['thalweg — locally deepest line','#ffd479'],['deeper than 20 m','#ff9d3d']],
   note:'THE SECOND METHOD, for the estuaries where drainage fragments. Not where water collects but WHERE THE GROOVE IS: a cell qualifies where it is the MINIMUM across its own cross-section and the seabed rises by at least 1.5 m on both sides, tested at four half-widths from 465 m to 3.7 km. That is what a thalweg is and what a pilot follows up an estuary. No connectivity guarantee, no draught test, nothing joined to anything — judge it against the drainage layer rather than on its own.',
   add:()=>map.addLayer({id:'x-thalweg',type:'line',source:'thl',
     paint:{'line-width':['interpolate',['linear'],['get','cells'],6,1.0, 40,1.8, 200,2.8],
            'line-color':['case',['>',['get','depth_max_m'],20],'#ff9d3d','#ffd479'],
            'line-opacity':.95}})},
 seabedfine:{label:'seabed channels — fine (232 m)', src:['sbf', C+'seabed_channels_fine.geojson'],
   legend:[['drainage 20-250 km2','#3d6b7d'],['250-2000','#3fb0c9'],['over 2000 km2','#9ceaff']],
   note:'THE SAME ANALYSIS AT 232 m, over a 30 km coastal band — which is where an estuary is more than two pixels wide and the network can actually enter it. Bounded landward by OS high water; within 8 km of land it includes water the 930 m visibility mask calls unseen, because an estuary can be LAND at 930 m. One polyline per channel, head to confluence, so a click selects a whole channel rather than one pixel of one. Offshore trunks are in the coarse layer, not this one.',
   add:()=>map.addLayer({id:'x-seabedfine',type:'line',source:'sbf',
     // THE RAMP MUST START AT THE THRESHOLD, NOT ABOVE IT. This began at 20 km2 while
     // the inshore threshold is 3, so every estuary channel fell off the bottom of the
     // ramp and drew at the minimum 0.5 px. The Thames looked empty and was not: 8.7%
     // of its cells are above threshold. The layer was right and the paint was wrong.
     paint:{'line-width':['interpolate',['linear'],['get','km2'],
                          3,1.1, 20,1.5, 250,2.2, 2000,3.4, 20000,5],
            'line-color':['interpolate',['linear'],['get','km2'],
                          3,'#7fd4ea', 20,'#4fc3e8', 250,'#3fb0c9', 2000,'#dff6ff'],
            'line-opacity':.95}})},
 seabed:{label:'seabed channels', src:['sbd', F+'seabed_channels.geojson'],
   legend:[['drainage 250-1000 km2','#4b7a8c'],['1000-5000','#3fb0c9'],
     ['over 5000 km2','#7ee0ff']],
   note:'AN INVERTED SUB-SEA STREAM NETWORK — Stephen idea, exploratory. D8 drainage run over the SEABED as if it were a terrain: water flows to the deepest place, so these trace the submarine valleys, and unlike a land network they converge AWAY from the coast. Bounded landward by the OS high water line and seaward by the land-visibility cells. Line width and colour are drainage area, which is a proxy for how much seabed funnels through that channel. NOT a router: no draught threshold, no weights, nothing joined to the rivers.',
   add:()=>map.addLayer({id:'x-seabed',type:'line',source:'sbd',
     paint:{'line-width':['interpolate',['linear'],['get','km2'],
                          250,0.6, 1000,1.4, 5000,2.8, 20000,4.5],
            'line-color':['interpolate',['linear'],['get','km2'],
                          250,'#4b7a8c', 1000,'#3fb0c9', 5000,'#7ee0ff'],
            'line-opacity':.9}})},
 traces:{label:'traces', src:['tr', F+'traces.geojson'],
   legend:[['traced path','#a371f7']],
   note:'Least-cost paths across the drying ground for the stranded termini.',
   add:()=>map.addLayer({id:'x-traces',type:'line',source:'tr',
     paint:{'line-width':2,'line-color':'#a371f7'}})},
 detail:{label:'routing detail (res 7)', src:null,
   legend:[['routing cell','#1f6feb'],['routing edge','#c9d1d9'],
     ['crosses a resolution band','#f0883e']],
   note:'THE LATTICE ITSELF, at the resolution it exists at, for whichever named area holds the centre of the view — zoom to one of the buttons above. Here cells and links are the same resolution, so a link DOES join two cell centres and nothing is a schematic. The layer above it is not: at res 6 the routing nodes are not the hexagon centres, whichever way the lines are drawn.',
   add:async()=>{ const a=areaAtCentre(); if(!a){ detailNote='no named area holds the centre of this view'; return; }
     detailNote='showing '+a;
     if(await src('dc', C+'cells-'+a+'.geojson'))
       map.addLayer({id:'x-detail-c',type:'fill',source:'dc',
         paint:{'fill-color':'#1f6feb','fill-opacity':.22,'fill-outline-color':'#388bfd'}});
     if(await src('de', C+'edges-'+a+'.geojson'))
       map.addLayer({id:'x-detail-e',type:'line',source:'de',
         paint:{'line-width':['case',['get','crosses_band'],2.2,0.9],
                'line-color':['case',['get','crosses_band'],'#f0883e','#c9d1d9'],
                'line-opacity':.9}}); }},
 joins:{label:'joins', src:['jn', F+'joins.geojson'],
   legend:[['rule 1 - in a cell','#3fb950'],['rule 2 - adjacent','#58a6ff'],
     ['rule 3 - needs a path (drawn as a dot)','#f85149']],
   note:'One line per tidal terminus to the cell it attaches to. Red DOTS are rule 3: no straight line is asserted because the path is worked out by the trace stage. They are 225 of the 389 joins, so most of this layer is dots.',
   add:()=>{ map.addLayer({id:'x-joins',type:'line',source:'jn',paint:{'line-width':1.6,
       'line-color':['match',['get','rule'],1,'#3fb950',2,'#58a6ff','#f85149']}});
     // A LINE LAYER CANNOT DRAW A POINT. Rule 3 emits a Point deliberately — there is no
     // straight line to assert, the path is the trace stage's business — and 225 of the
     // 389 joins are rule 3. So 58% of the joins had never appeared on this page, and
     // Stephen read their absence as missing joins on the Crouch and the Blackwater.
     // They were there; nothing drew them.
     map.addLayer({id:'x-joins-pt',type:'circle',source:'jn',
       filter:['==',['geometry-type'],'Point'],
       paint:{'circle-radius':4,'circle-color':'#f85149','circle-opacity':.85,
              'circle-stroke-width':1,'circle-stroke-color':'#ffb4ab'}}); }}};
// A bookmarked URL from when these were stages must still open somewhere sensible.
const FROM_STAGE={sightline2:'cells', sightline:'cells', joins:'joins', traces:'traces'};
function hashGet(k){ for(const p of location.hash.replace(/^#/,'').split('&')){
    const [a,...b]=p.split('='); if(a===k) return b.join('='); } return null; }
function hashSet(k,v){ const parts=location.hash.replace(/^#/,'').split('&').filter(Boolean)
    .filter(p=>p.split('=')[0]!==k); parts.push(k+'='+v);
  history.replaceState(null,'','#'+parts.join('&')); }
let loaded={}, summaries={}, areas={};
const KEYS=Object.keys(LAYERS);
function initial(){ const h=hashGet('layers');
  if(h!==null) return new Set(h.split(',').filter(k=>KEYS.includes(k)));
  const st=hashGet('stage'); if(st&&FROM_STAGE[st]) return new Set([FROM_STAGE[st]]);
  return new Set(['cells','net']); }
let on=initial();
window.map=map;                       // a top-level const is NOT on window
window.__drawn=0;                     // increments when a draw has finished
window.toggle=async k=>{ on.has(k)?on.delete(k):on.add(k);
  hashSet('layers',[...on].join(','));
  await draw(); };
// the driver and a bookmarked link both need to set the whole set at once
window.setLayers=async list=>{ on=new Set(list.filter(k=>KEYS.includes(k)));
  hashSet('layers',[...on].join(','));
  await draw(); };
window.setStage=async s=>window.setLayers([FROM_STAGE[s]||s]);
window.zoomTo=a=>{ if(a==='all'){ const e=areas._extent||[-8,49.5,2,61];
    map.fitBounds([[e[0],e[1]],[e[2],e[3]]],{padding:20}); return; }
  else map.fitBounds([[areas[a][0],areas[a][1]],[areas[a][2],areas[a][3]]],{padding:40}); };

let detailNote='';
// MAXIMUM RESOLUTION. The routing grid is res 7 nearly everywhere, res 8-9 in the refined
// estuaries, and RES 6 WHERE SIGHT IS LOST — the closed blind hops are binned coarse, so a
// band boundary is the edge of water you cannot see across. That is what the seams mean,
// and it is why this selector exists: it was not visible at one resolution.
// 6 is the finest offered for the whole extent (res 7 is 415,520 edges and 80 MB); the
// detail toggle gives 7 and finer for a named area.
const RES_SRC={6:[F+'sightline2_r6.geojson', F+'edges.geojson'],
               5:[C+'cells-r5.geojson', C+'edges-r5.geojson'],
               4:[C+'cells-r4.geojson', C+'edges-r4.geojson']};
let maxRes=parseInt(hashGet('res')||'6');
let osmO=parseFloat(hashGet('osm')??'0');
// THE TWO BACKDROPS CROSS-FADE. The dark coastline fills are a stand-in for a basemap;
// with a real one under them they would simply hide it, so they fade out as it comes up.
function applyFade(){
  if(map.getLayer('osm')) map.setPaintProperty('osm','raster-opacity',osmO);
  for(const id of ['x-bg-land','x-bg-coast'])
    if(map.getLayer(id)) map.setPaintProperty(id,'fill-opacity',1-osmO);
  const el=document.getElementById('osmv'); if(el) el.textContent=Math.round(osmO*100)+'%';
}
function areaAtCentre(){ const c=map.getCenter();
  for(const [k,b] of Object.entries(areas)){ if(k[0]==='_') continue;
    if(c.lng>=b[0]&&c.lng<=b[2]&&c.lat>=b[1]&&c.lat<=b[3]) return k; }
  return null; }

function srcUrl(i){ return RES_SRC[maxRes][i]; }

async function gj(u){ if(loaded[u])return loaded[u];
  const r=await fetch(u); if(!r.ok) return null; loaded[u]=await r.json(); return loaded[u]; }

async function src(id,url){ const d=await gj(url); if(!d)return false;
  if(map.getSource(id)) map.getSource(id).setData(d); else map.addSource(id,{type:'geojson',data:d});
  return true; }

function clear(){ for(const l of map.getStyle().layers) if(l.id.startsWith('x-')) map.removeLayer(l.id); }

async function draw(){
  clear();
  // land outside GB, from EMODnet, drawn first and dimmer: it is context, not a coastline
  if(await src('land', C+'land.geojson'))
    map.addLayer({id:'x-bg-land',type:'fill',source:'land',
      paint:{'fill-color':'#11161d','fill-outline-color':'#262c36'}});
  await src('coast', C+'coastline.geojson');
  map.addLayer({id:'x-bg-coast',type:'fill',source:'coast',
    paint:{'fill-color':'#161b22','fill-outline-color':'#30363d'}});
  for(const k of KEYS){                 // declaration order IS paint order
    if(!on.has(k)) continue;
    const L=LAYERS[k];
    if(L.src===null){ await L.add(); continue; }
    const sp=typeof L.src==='function'?L.src():L.src;
    if(await src(sp[0], sp[1])) await L.add();
  }
  const act=KEYS.filter(k=>on.has(k));
  // THE LEGEND IS THE CONTROL. A separate row of buttons said the same thing twice and
  // put the switch furthest from the swatch it governs. Every layer is listed whether on
  // or off, so the panel says what EXISTS as well as what is showing — a control that
  // hides its off state cannot be read.
  legend.innerHTML = KEYS.map(k=>{
    const L=LAYERS[k], is=on.has(k);
    return `<div class="grp${is?' on':''}" data-s="${k}">`
      + `<span class="tick">${is?'&#10003;':''}</span>${L.label}</div>`
      + `<div class="keys${is?'':' off'}">`
      + L.legend.map(([t,c])=>`<div class="key"><div class="sw" style="background:${c}"></div>${t}</div>`).join('')
      + `</div>`;
  }).join('');
  // JOINS AND TRACES DO NOT MOVE WITH THE SELECTOR, and at res 5 a join drawn across a
  // res-5 hexagon looks as though it attaches to that hexagon's centre. It does not:
  // no join targets a res-5 cell — they are res 7 (341), res 8 (43) and res 6 (5). Say so
  // rather than let the picture imply it.
  const mism = maxRes!==6 && (on.has('joins')||on.has('traces'));
  warn.innerHTML = (mism?'<p><b>Note.</b> The resolution selector changes the CELLS and '
    +'the SEA NETWORK only. Joins and traces are drawn at their own resolution and do not '
    +'move with it, so a join crossing a coarse cell does not attach to that cell.</p>':'')
    + act.map(k=>`<p><b>${LAYERS[k].label}.</b> ${LAYERS[k].note}`
      +(k==='detail'&&detailNote?` <i>(${detailNote})</i>`:'')+`</p>`).join('')
    || 'Every layer is off.';
  applyFade();
  figures();
  // Signal completion from the page rather than have the driver guess. `load` fires
  // long before anything is drawn: my first headless shot was a blank panel and an
  // empty map, and it was the screenshot that was early, not the page that was broken.
  await new Promise(r=>map.once('idle',r));
  window.__drawn++;
}

function figures(){
  const g=summaries.grid_summary||{}, j=summaries.join_summary||{},
        t=summaries.trace_summary||{}, e=summaries.edge_summary||{},
        sl=summaries.sightline_summary||{};
  const per={
    cells:[['cells drawn',(loaded[srcUrl(0)]||{}).properties?.cells
                          ??(loaded[srcUrl(0)]||{}).features?.length],
           ['sea cells',sl.sea_cells],['see land',sl.see_land],['reach bands',sl.bands],
           ['max reach km',sl.max_reach_km],['tallest land m',sl.tallest_land_m]],
    // NOT e.edges: that is the res-7 graph, 415,520, and the layer draws 49,080 of them
    // aggregated. A figure beside a picture must count what is in the picture — the same
    // fault I warned visualisation about, committed here two hours later.
    net:[['links drawn',(loaded[srcUrl(1)]||{}).properties?.links],
         ['seams drawn',(loaded[srcUrl(1)]||{}).properties?.crossing_a_band],
         ['not drawn: over land',
          (loaded[srcUrl(1)]||{}).properties?.links_over_land_not_drawn],
         ['components',e.components],['isolated',e.isolated],
         ['rejected: crossed land',e.links_rejected_crossing_land]],
    traces:[['attempted',t.attempted],['traced',t.traced],['failed',t.failed]],
    joins:[['termini',j.termini],['rule 1',(j.by_rule||{})['1']],
           ['rule 2',(j.by_rule||{})['2']],['rule 3',(j.by_rule||{})['3']]]};
  const rows=[];
  // a layer with no figures of its own must not throw: `detail` has none
  for(const k of KEYS) if(on.has(k)) for(const r of (per[k]||[])) rows.push(r);
  figs.innerHTML=rows.filter(r=>r[1]!==undefined&&r[1]!==null)
    .map(([k,v])=>`<tr><td>${k}</td><td class="v">${v.toLocaleString?.()??v}</td></tr>`).join('');
}

map.on('click',e=>{ const f=map.queryRenderedFeatures(e.point).filter(f=>f.layer.id.startsWith('x-')&&!f.layer.id.startsWith('x-bg'))[0];
  if(!f)return; const p=f.properties;
  new maplibregl.Popup().setLngLat(e.lngLat).setHTML(
    Object.entries(p).filter(([k])=>!k.startsWith('landmark_l'))
      .map(([k,v])=>`<b>${k}</b> ${v}`).join('<br>')).addTo(map); });

map.on('load',async()=>{
  summaries=await gj(C+'summaries.json')||{}; areas=await gj(C+'areas.json')||{};

  // a click anywhere also writes the point to the hash, so a cell can be pointed at
  map.on('click', e=>hashSet('at', e.lngLat.lat.toFixed(4)+','+e.lngLat.lng.toFixed(4)));
  legend.onclick=ev=>{ const g=ev.target.closest('.grp'); if(!g)return;
    window.toggle(g.dataset.s); };
  areasEl.innerHTML=`<button data-a="all">all</button>`+Object.keys(areas).filter(a=>a[0]!=='_').map(a=>
    `<button data-a="${a}">${a}</button>`).join('');
  areasEl.onclick=ev=>{ const a=ev.target.dataset.a; if(!a)return;
    if(a==='all') window.zoomTo('all');
    else map.fitBounds([[areas[a][0],areas[a][1]],[areas[a][2],areas[a][3]]],{padding:40}); };
  // only frame the whole extent when the URL does not already say where to look
  const rs=document.getElementById('res');
  rs.innerHTML=Object.keys(RES_SRC).sort((a,b)=>b-a).map(r=>
    `<option value="${r}"${+r===maxRes?' selected':''}>res ${r} and coarser</option>`).join('');
  document.getElementById('resnote').textContent=
    'Res 6 is the finest offered here. For res 7 and finer, switch on routing detail '
    +'inside a named area.';
  rs.onchange=async()=>{ maxRes=+rs.value; hashSet('res',maxRes); await draw(); };
  const sl=document.getElementById('osm');
  sl.value=Math.round(osmO*100);
  sl.oninput=()=>{ osmO=sl.value/100; hashSet('osm',osmO.toFixed(2)); applyFade(); };
  if(!hashGet('map')) window.zoomTo('all');
  map.on('moveend',()=>{ if(on.has('detail')) draw(); });
  draw();
});
const legend=document.getElementById('legend'), figs=document.getElementById('figs'),
      warn=document.getElementById('warn'), areasEl=document.getElementById('areas');
</script></body></html>
