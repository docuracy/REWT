rules:
- id: R-01
  order: 1
  kind: specification
  title: The sea is the Mean High Water line, not a set of survey nodes.
  statement: Define tidal water by the Ordnance Survey Mean High Water line. A watercourse
    that crosses it is truncated at the crossing and connected there; a watercourse lying
    entirely below it is dropped from the network. This is settled before any synthetic connector
    is added, because a connector built against the wrong sea cannot be recognised as wrong
    afterwards.
  why: The present sea network is a specification, not a measurement, and a great many sea
    entries lie a long way from it. A distance-from-a-node test decides the question at exactly
    the estuaries where the answer matters — which is the objection PLAN.md §5 makes to deciding
    it from a coastline, and it applies to the current network for the same reason.
  status: proposed
  stage: sea
  needs:
  - 'MEASURED, AND THE RULE IS UNDER-SPECIFIED FOR A QUARTER OF ITS OWN CASES. `truncate at
    the crossing` presumes there is one. Of 6,926 in-scope links that meet the line: 5,071
    cross once; 1,274 (18.4%) yield MORE THAN ONE landward piece when clipped, up to eight,
    weaving in and out along estuary edges; and 581 clip to ZERO landward length — they graze
    the boundary rather than crossing it, so a classifier keyed on `crosses` is answering
    a question they do not pose. A further 1,497 leave a landward remnant under one metre
    and 2,423 are more than 99% landward, where a cut creates a node and a retirement and
    changes nothing.'
  - 'SO CLASSIFY BY THE CLIPPED LANDWARD FRACTION, not by a topological predicate. `contains_properly`
    is false for a wholly-landward link that touches the boundary, and `intersects` is true
    for one that merely grazes it; the fraction of a link''s length inside the land polygon
    is the quantity the rule is actually about, and it handles the grazers, the weavers and
    the sub-metre remnants uniformly. Two thresholds are then needed and neither is chosen
    yet: below what fraction a link is treated as wholly seaward, and below what landward
    length a cut is not worth making. Both belong in conf/params.yml.'
  - 'MARK THEM OUT OF SCOPE, NOT RETIRED. An attempt to retire the wholly-seaward links failed
    `test_nothing_was_deleted_to_correct_it` on 7,474 links naming nothing that superseded
    them, and the guard was right: a retirement here means a correction replaced this, and
    nothing replaces these. PLAN.md §4.1 already holds the mechanism — `Nothing is deleted.
    Out-of-scope links are flagged, not dropped` — and a link below high water is not a corrected
    link, it is a link that is not part of this network.'
  - 'THE TWO HALVES ARE ONE CHANGE AND CANNOT BE LANDED SEPARATELY. Retiring the seaward reaches
    without cutting the crossers removed the outlets the crawl seeds from and supplied no
    replacements: `reaches neither` went from 3,894 km (3.7%) to 21,259 km (20.7%). Not a
    broken network — a deleted sea. The truncation point IS the new terminus, so it must exist
    before the old one is taken away.'
  - THE NAME IS NOT THE SAME NAME. OS calls this High Water Mark, the administrative coastline,
    not Mean High Water, a tidal datum. The products carrying MHW/MHWS as a named tidal feature
    are VectorMap District and MasterMap, neither registered. HWM is the right line and costs
    nothing, but the substitution goes on the record rather than being assumed away.
  - 'DEDUPE BEFORE MEASURING ANYTHING. The layer has 32,850 rows and 13,002 geometries: each
    segment repeats once per administrative file that bounds on it, mean 2.5x, across 380
    File_Name values. Global_Link_ID is the exact key (13,002 distinct, confirmed independently
    by hashing the geometry blobs). Any coastline length measured without dedupe is ~2.5x.'
  - The row count is Scotland-dominated — Highlands and Islands alone is 6,443 rows. England
    and Wales is 6,191 segments and 16,057 km against 13,002 and 34,792 km for GB. Do not
    read a GB figure as a scope figure.
  supersedes: []
  raised: 2026-09-03
  raised_by: stephen
  source: rules/0001.md
  evidence_count: 1
- id: R-02
  order: 2
  kind: specification
  title: A basin may not contain the sea.
  statement: Remove tidal water from the surface before delineating catchments, and hold no
    basin whose polygon contains the sea network. Where watercourses share an estuary they
    do not share a catchment, and a delineation that says otherwise is to be reported as a
    defect rather than carried into scope.
  why: 'Measured on the v0.2.0-alpha build: 110 of 334 in-scope basins have polygons that
    intersect this project''s own sea network and 25 hold 10 km or more of it, measured clipped
    to the polygon — an unclipped count says 51 and is wrong. Two — labelled River Earn and
    River Nith — are 4,176.3 and 9,655.0 km2 against real catchments near 800 and 1,230, contain
    open sea off Arbroath, the mid Firth of Forth, the mid Solway and the mid Firth of Clyde,
    and pull 5,411.5 km of network into scope — the whole network in the two basins, of which
    46.1% and 49.9% of the AREA is Scottish and the length split is unmeasured — carrying
    118 of the 1,303 declared defects. It is not a Scottish fault: River Deben contains sea
    off its own mouth and River Lea contains the mid Thames estuary. The build does not miss
    them; it files them where they look right — published/audit/basins.json reports the Nith
    and the Earn as `cross_border_basin` findings beside the Tweed and the Esk, which are
    the legitimate cross-border cases D-024 names, so an amalgam is reported as an instance
    of a category working as designed. 12 in-scope basins enclose more sea network than river
    network; 99 enclose sea at all, 2,896.9 km clipped. This is PLAN.md §4.1''s shared-estuary
    trap occurring in the topographic delineation rather than in the component test the warning
    was written about. There are two failures here and only one shows in the scope figures.
    The Nith and the Earn drag Scottish network into scope, which is how they were found.
    The `rewt:basin-unanchored/` coalescences do not: "River Aire" is 11,873.5 km2 with `outlet_node`
    NULL and an England-and-Wales area of the whole 11,873.5, so no scope figure can see it
    and nothing else looks. That is the more dangerous kind.'
  status: proposed
  stage: basins
  needs:
  - R-01 first. What the sea IS is R-01's question; this rule only says a basin may not contain
    it, and cannot be tested until the answer is stable.
  supersedes: []
  raised: 2026-09-03
  raised_by: rewt-46
  source: rules/WORK-PACKAGE-01.md
