- id: R-07
  order: 7
  kind: detection
  title: A canal dead end with two inflows is suspect, and is not reversed on that account.
  statement: A dead-end node on a canal reached by two inflows and no outflow is reported
    as a candidate direction fault, and more strongly where a terrain screen disagrees with
    one of the inflows. It is reported and not acted on. No canal link is reversed because
    reversing it improves a total.
  why: 'Water leaves a canal through locks, weirs and feeders the survey does not draw, so
    two inflows meeting at a dead end usually means one is drawn backwards. But PLAN.md §5
    measures the trap on the other side: a canal is level by construction, 82.3% of canal
    links fall inside Terrain 50''s own error bar, and the Monmouthshire and Brecon falls
    0.00 m over 3.91 km on a 1 m surface. Neither direction is defensible from the terrain,
    so the screen may rank a candidate and may never settle one. A canal may also legitimately
    drain two ways from a summit pound, which is the `mode: both` case and is not a fault
    at all.'
  status: proposed
  stage: repair
  needs:
  - The rule must be written so it cannot reverse a canal link. PLAN.md §5 says the remedy
    for flat water is a connector at the structure, never a reversal (D-011).
  supersedes: []
  raised: 2026-09-03
  raised_by: stephen
  source: rules/0001.md
  evidence_count: 1
- id: R-08
  order: 8
  kind: repair
  title: A gap through a water body is closed by the polygon's medial axis.
  statement: Where the survey gives no route through a lake, reservoir or broad, the route
    is the medial axis of the water-body polygon, skeletonised from OS OpenMap – Local. Where
    the survey gives a schematic straight line across standing water, the line is kept and
    flagged as a routing device rather than a channel. Skeletonise only where it earns its
    place, and never through tidal water, where a medial axis is a line down the middle of
    a bay.
  why: This is PLAN.md §5's specification and the question is whether the build still does
    it. Gaps of exactly this shape are open in the current network. It is recorded here as
    a rule because the answer "we used to" is the one that needs finding out.
  status: proposed
  stage: water
  needs:
  - First establish what rewt/stages/water.py does now. This is a question about the present
    build, not a proposal, and the answer may be that the rule is already implemented and
    failing at these places for another reason.
  supersedes: []
  raised: 2026-09-03
  raised_by: stephen
  source: rules/0001.md
