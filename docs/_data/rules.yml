- id: R-04
  order: 4
  kind: detection
  title: Every crossing that does not join is marked as one.
  statement: 'Where two watercourses cross without sharing a node, the crossing is recorded
    as a non-join, whatever its provenance. The record is complete or it is not a record:
    a crossing the build does not mark cannot be adjudicated, and its absence is indistinguishable
    from a decision that it joins.'
  why: Crossings that do not join are being missed, and both a survey link and a synthetic
    one are among the misses — so the gap is in the detection and not in one class of geometry.
  status: proposed
  stage: repair
  needs:
  - A completeness check, not a sample. The question is 'is there anything else', and a truncated
    listing cannot answer it (TEAM.md).
