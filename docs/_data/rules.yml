- id: R-09
  order: 9
  kind: detection
  title: Elevation may rank a direction candidate and may never settle one.
  statement: A terrain surface is a screen. It orders candidates for adjudication and it does
    not flip a link. No direction correction is recorded as made on terrain evidence where
    the fall lies inside the surface's own error bar, and no sampler infers coverage from
    the absence of nodata.
  why: PLAN.md §5 measured both halves. Terrain 50 is mute on 24.3% of links and on 82.3%
    of canals, and the English LiDAR service returns zeros over Wales rather than nodata —
    a sampler without an explicit coverage test computes confident nonsense for the whole
    of Wales and it does not look like an error. A proposal to lean harder on a higher-resolution
    surface does not change either fact, and this rule is what any such proposal has to survive.
  status: accepted
  stage: screen
  needs:
  - The rule is accepted on PLAN.md §5's own measurements. What was DECLINED is the proposal
    that raised it — see `declined` below — and the rule stands either way.
  supersedes: []
