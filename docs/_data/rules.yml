- id: R-03
  order: 3
  kind: repair
  title: A sea entry within reach of the sea network is connected to it.
  statement: A terminus classified as a sea entry that lies within the connection tolerance
    of a sea network node is connected to that node. A sea entry recorded as blocked is offered
    a longer tolerance than an unobstructed one, and the two tolerances are separate parameters
    because they answer different questions.
  why: Sea entries that plainly reach the sea are being left unattached, which strands everything
    above them and puts the length into the defect list under a cause it does not have.
  status: proposed
  stage: sea
  needs:
  - Both parameters to be added to conf/params.yml. Neither exists; this rule states no number
    and must not.
  - 'R-01 first: if the sea becomes the Mean High Water line, some of these entries are truncations
    rather than connections.'
  supersedes: []
