- id: R-05
  order: 5
  kind: detection
  title: Corroboration of a non-join must corroborate that non-join.
  statement: A feature may corroborate a non-join only where it explains the crossing at that
    place. Proximity is not corroboration. Where no feature explains it, the non-join stays
    uncorroborated and remains a candidate; where a feature is merely nearby, it is not cited
    at all.
  why: The failure runs in both directions from one cause, which is why this is one rule and
    not two. A node at E 396919.51 N 161634.75 that should be a junction is marked a corroborated
    non-join on the strength of a Canal and River Trust culvert that happens to be near it
    — so a real connection is barred by evidence that was never about it. In the other direction
    an uncorroborated non-join is barring a connection that nothing argues against. A corroborated
    verdict is the strongest thing this build says about a place, and it is being reached
    by distance.
  status: proposed
  stage: repair
  needs:
  - A decision entry on what may corroborate what, before any code. The present behaviour
    is a definite answer that was never measured (D-077).
  supersedes: []
  raised: 2026-09-03
  raised_by: stephen
  source: rules/0001.md
