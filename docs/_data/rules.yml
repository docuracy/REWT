- id: R-06
  order: 6
  kind: repair
  title: An aligned dead end near an unattached end is a candidate join.
  statement: 'Where extending a link beyond a dead-end node along its own bearing passes within
    the search distance of the unattached end of another link, and the two bearings agree
    within the angular tolerance, the pair is a candidate for connection. It is a candidate
    and not a connection: the rule proposes, and adjudication records the judgement in data/curated/.'
  why: Two channels that continue each other's line and stop a few metres apart are the commonest
    shape of a real gap, and the pair is recognisable from geometry alone without appeal to
    elevation.
  status: proposed
  stage: repair
  needs:
  - Both parameters to be added to conf/params.yml. Neither exists.
  - 'Before believing the selector, confirm it excludes something (D-070): print what it matches
    against the population of dead ends, not a percentage.'
  supersedes: []
  raised: 2026-09-03
  raised_by: stephen
  source: rules/0001.md
