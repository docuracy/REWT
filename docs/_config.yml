title: REWT
description: Rivers of England and Wales, Temporally
theme: jekyll-theme-primer

# Project pages are served under /REWT/, and `relative_url` needs to be told so —
# without it the stylesheet and the favicon resolve to the wrong host root.
url: "https://docuracy.github.io"
baseurl: "/REWT"

# Every page gets the navigation without having to say so in its front matter.
defaults:
  - scope:
      path: ""
    values:
      layout: default

# The navigation, in one place. `url` is relative to baseurl.
#
# `right: true` sends an item to the far end of the bar, and `icon` gives it a glyph.
# Both mark the same distinction: everything to the left is a page ABOUT the project,
# and the item on the right IS the thing. /tracer describes the snap-to-ink tracer;
# /viewer/ is the map itself, and clicking it leaves prose for an application. The bar
# says that twice, by position and by icon, because position alone is a convention a
# reader has to already know.
nav:
  - title: Introduction
    url: /
  - title: Aims
    url: /aims
  - title: Methodology
    url: /methodology
  - title: Evidence
    url: /evidence
  - title: Landscapes
    url: /regions/
  - title: Temporality
    url: /epochs
  - title: Scale
    url: /scale
  - title: Tracer
    url: /tracer
  - title: Routing
    url: /routing
  - title: Sources
    url: /sources
  - title: Background
    url: /background
  - title: Viewer
    url: /viewer/
    right: true
    icon: map

exclude:
  - README.md
