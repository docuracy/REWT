name: Deposit the release to Zenodo, with the data

# WHY THIS EXISTS, GIVEN ZENODO IS ALREADY LINKED TO THIS REPOSITORY.
#
# The GitHub-Zenodo hook archives the SOURCE ZIPBALL at the tag and nothing else.
# This repository commits nothing acquired, derived or built — data/, db/ and
# published/ are all ignored — so the record that hook produces would contain the
# code, the configuration and the 1,559 curated judgements, and NO RIVERS AT ALL.
# That is a defensible thing to archive and it is not what someone clicking a DOI
# expects (D-051's neighbour in reasoning: an artefact that resolves is worse than
# one that does not, when it resolves to the wrong thing).
#
# So this workflow deposits explicitly: it takes the assets attached to the GitHub
# release and uploads them to a Zenodo deposition alongside the metadata, so the DOI
# resolves to the network as well as the method.
#
# IT FAILS LOUDLY WITHOUT A TOKEN rather than falling back to the hook's behaviour.
# A silent fallback would produce a code-only record that looks like a success, and
# nobody would look at it again until a reader complained there was no data in it.

on:
  release:
    types: [published]
  # RE-RUNNABLE FOR A TAG THAT IS ALREADY OUT, and it exists because the first deposit
  # needed exactly that. It failed on missing metadata AFTER uploading 523 MB, and
  # re-running the failed run was no use: a release run checks out the TAG, so it would
  # have replayed the same code that failed. The choice was then between deleting a
  # published release to re-cut it and being unable to finish the deposit at all.
  #
  # Dispatching runs on whichever branch is chosen, so the fix is picked up while the
  # tag and its assets stay exactly as they were. The deposit reads the release by name
  # through the API and does not care which tree it is running from.
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to deposit"
        required: true

permissions:
  contents: read

jobs:
  deposit:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run without a Zenodo token
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          if [ -z "$ZENODO_TOKEN" ]; then
            echo "::error::ZENODO_TOKEN is not set. This workflow exists to put the"
            echo "::error::DATA in the Zenodo record; without a token it can only"
            echo "::error::produce the code-only deposit the plain hook already makes,"
            echo "::error::which would resolve to a river project containing no rivers."
            echo "::error::Create a personal access token at"
            echo "::error::https://zenodo.org/account/settings/applications/tokens/new/"
            echo "::error::with scopes deposit:write and deposit:actions, and add it as"
            echo "::error::the repository secret ZENODO_TOKEN."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Resolve which release is being deposited
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$TAG" ]; then echo "::error::no tag given"; exit 1; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # The notes are read back from the release rather than regenerated, so the
          # Zenodo description is the text that was actually published on GitHub.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > body.md
          echo "depositing $TAG ($(wc -l < body.md) lines of notes)"

      - name: Fetch the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          mkdir -p assets
          gh release download "$TAG" --dir assets --repo "$GITHUB_REPOSITORY"
          echo "attached to the release:"; ls -la assets
          if [ -z "$(ls -A assets)" ]; then
            echo "::error::the release carries no assets, so there is nothing to"
            echo "::error::deposit but the source. Attach the built network first."
            exit 1
          fi

      - name: Deposit to Zenodo
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          # Via a file, not an env var: the notes carry backticks, asterisks and
          # newlines, and passing 1,200 words of Markdown through the shell is a
          # quoting bug waiting for the one release whose text happens to break it.
          BODY="$(cat body.md)" python .github/scripts/zenodo_deposit.py
