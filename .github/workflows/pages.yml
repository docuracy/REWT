name: Publish the site

# Pages now builds from a workflow rather than from a branch, and that change is what
# makes the whole dataset servable. Serving from `main:/docs` means anything published
# must be committed, and `.gitignore`'s first rule is that nothing acquired, derived
# or built is committed — so a tiled network could never have been published that way
# without breaking it.
#
# Building here instead, nothing derived enters the repository: the tiles are made in
# CI and deployed straight to Pages. The rule is kept rather than excepted from.

on:
  push:
    branches: [main]
    # conf/sources.yml and the projector are here because the citations page is
    # GENERATED from the manifest. A manifest edit that did not rebuild the site
    # would leave the published page crediting last month's terms, and a licence
    # page that is quietly out of date is worse than no page at all.
    paths: ['docs/**', 'conf/sources.yml', 'tools/docs/**', '.github/workflows/pages.yml']
  # A NEW RELEASE IS A NEW MAP — the data the viewer reads is fetched from the latest
  # release, not built here and not committed — but this workflow CANNOT be triggered
  # by the release event. A release run carries the tag as its ref, and the
  # `github-pages` environment refuses to deploy from one; the build job passes and the
  # deploy job is rejected by a protection rule. `site-after-release.yml` catches the
  # release and dispatches this workflow on the default branch instead.
  #
  # Adding `rewt/tiles.py` to the paths above would also be the intuitive fix and the
  # wrong one: an edit there deploys nothing until a release carries it, and a release
  # with no code change at all still needs this to run.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A RELEASE EVENT'S REF IS THE TAG, and checking it out would rebuild the site
          # from the tree as it stood at the tag — silently reverting every
          # documentation commit made since, with a green run and no diff to look at.
          # The map data comes from the release API further down and does not depend on
          # this ref at all, so the tree wanted here is always the current
          # documentation. A release says new data exists; it is not an instruction to
          # travel back to the code that made it.
          #
          # `sources_page.py --check` below would not have caught it: it compares two
          # files in the same tree, and at the tag they agree. Internal agreement is not
          # correctness unless something anchors it outside itself — the same fault this
          # workflow's attribution check was rewritten to avoid.
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.sha }}

      - name: Refuse to publish a credential
        run: |
          # GitHub Pages serves docs/ publicly. This repository's own gates run in the
          # build, but the build is not what publishes — this workflow is. So the check
          # runs HERE too, against exactly what is about to be deployed.
          #
          # It looks for a tile provider's name beside an opaque value, which is what a
          # published basemap configuration looks like whatever the surrounding key is
          # called. The repository's pattern check requires an `api` prefix and would
          # not catch `{"keys": {"maptiler": "..."}}`.
          # `.{0,40}` and not `[^"']{0,40}`: in `"maptiler": "<key>"` the characters
          # immediately after the provider name ARE quotes, so a class excluding them
          # matches nothing. The first version of this line was silent on the exact
          # case it was written for, and four probes caught it — two that must block,
          # two that must not.
          if grep -rEiI "(maptiler|mapbox|thunderforest|stadiamaps|cartocdn).{0,40}[\"'][A-Za-z0-9_-]{16,}[\"']" docs/ ; then
            echo "::error::A tile provider's key looks present in docs/. Pages is public"
            echo "::error::even when the repository is not, and a published key can only"
            echo "::error::be rotated, never withdrawn. Refusing to deploy."
            exit 1
          fi
          echo "no provider credential found in docs/"

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Refuse to publish a stale citations page
        run: |
          # docs/_data/sources.yml is a PROJECTION of conf/sources.yml, committed
          # because Pages runs Jekyll in safe mode: the site cannot read conf/, and a
          # symlink out of the source is ignored rather than followed. So the copy is
          # written by a script somebody has to remember to run, and this is what
          # happens when they do not.
          #
          # It fails the deploy rather than regenerating in place. A workflow that
          # quietly fixed it would publish an attribution nobody had reviewed, which is
          # the same fault in a more confident voice.
          pip install --quiet pyyaml
          python tools/docs/sources_page.py --check

      - name: Refuse to publish a stale rules page
        run: |
          # docs/_data/rules.yml is a PROJECTION of conf/rules.yml, for the same reason
          # and with the same hazard as the citations page above: Jekyll runs in safe
          # mode, cannot read conf/, and ignores a symlink out of the source, so the copy
          # is written by a script somebody has to remember to run.
          #
          # THE STALE DIRECTION THAT MATTERS IS ONE-WAY. conf/rules.yml is the canonical
          # list (D-078) and `status` there says what is true of the BUILD, not what
          # anyone intends. A projection left behind therefore publishes a rule as
          # `implemented` when the build has it `proposed` — telling a reader the network
          # obeys something it does not. That is the failure this step exists for, and
          # `rules_page.py --check` was verified to fail on exactly that perturbation
          # before this step was added: a check nobody has seen fail is not a check
          # (D-082).
          python tools/docs/rules_page.py --check

      - name: Fetch what the map reads from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # THE DATA CANNOT BE BUILT HERE. It needs OS Open Rivers, Terrain 50, EMODnet
          # and the hours the terrain stage takes; a documentation deploy is not the
          # place for any of that. So `rewt viewer-data` builds it beside a finished
          # published/, `rewt release` attaches it, and this step brings it in.
          #
          # The hop through this workflow is the point, not an inconvenience. Release
          # assets send no CORS header, so a browser cannot read one; Pages sends CORS
          # AND honours Range, which is what lets a PMTiles archive be read a viewport
          # at a time instead of downloaded whole. Downloading server-side and serving
          # from Pages is what makes the WHOLE network loadable rather than an extract.
          mkdir -p docs/viewer/data
          tag=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)
          if [ -z "$tag" ]; then
            echo "::warning::No release yet, so the map deploys without its data."
            echo "::warning::The viewer NAMES each absent layer on the page rather than"
            echo "::warning::drawing an empty map — an absent layer and an empty one are"
            echo "::warning::opposite things and must not look alike. This is that path."
            exit 0
          fi
          if ! gh release download "$tag" --pattern 'viewer-data.tar' --dir /tmp; then
            echo "::warning::Release $tag carries no viewer-data.tar; deploying without it."
            exit 0
          fi
          tar -xf /tmp/viewer-data.tar -C docs/viewer/data

          # WHICH RELEASE THIS DATA IS, recorded here because this is the only place
          # that knows. `rewt viewer-data` stamps summary.json's citation with the
          # version in CITATION.cff AT BUILD TIME, and cutting a release bumps that file
          # — so the first deploy of v0.1.1-alpha carried a citation reading v0.1.0-alpha
          # and told readers to cite an edition its numbers did not come from. The
          # fourteen minutes between building the asset and tagging it is enough.
          #
          # Additive rather than a patch to summary.json: the stamped version is what
          # the build believed and is worth keeping, and the tag is what the asset was
          # actually attached to. The viewer prefers the tag and says so.
          printf '{"tag": "%s"}\n' "$tag" > docs/viewer/data/release.json

          # THE ASSET MUST BE THE SAME BUILD AS THE PROVENANCE BESIDE IT.
          #
          # D-049's rule one layer out: an archive can be internally consistent and
          # still come from a different pass than the record that describes it. rewt-6a
          # found exactly that locally — a tar ninety minutes older than the tiles, with
          # counts that agreed — and `release-check` catches it there. Nothing checked it
          # HERE, where the artefact is actually served, and the tracer is about to bind
          # contributed evidence to `link_id`s read out of this archive: a stale
          # identifier scheme would not draw a wrong map, it would attach a historical
          # claim to identifiers the source no longer mints. Raised by rewt-2b.
          #
          # WHAT IT PROVES AND WHAT IT DOES NOT. `config_fingerprint` digests
          # conf/sources.yml and conf/params.yml, so agreement proves the tiles and the
          # deposited provenance came from one configuration. It does NOT prove the asset
          # was built by the code in this tree, and it must not try: `main` advances past
          # every release by design, so comparing against the checked-out tree would fail
          # every deploy after any commit. The TAG is what both artefacts claim, and this
          # checks that they agree about it.
          gh release download "$tag" --pattern 'provenance.json' --dir /tmp --clobber
          want=$(python3 -c "import json;print(json.load(open('/tmp/provenance.json'))['config_fingerprint'])")
          got=$(python3 -c "import json;print(json.load(open('docs/viewer/data/summary.json'))['provenance']['config_fingerprint'])")
          if [ "$want" != "$got" ]; then
            echo "::error::viewer-data.tar was built under configuration $got, while"
            echo "::error::release $tag deposits provenance for $want. The map and the"
            echo "::error::record published beside it are different builds. Refusing to"
            echo "::error::deploy: this fails rather than warns, by design."
            exit 1
          fi
          echo "configuration fingerprint $got matches the release's provenance"
          echo "from release $tag:"
          ls -la docs/viewer/data

      - name: Write the viewer's key file
        env:
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        run: |
          # THE ONLY CREDENTIAL THAT REACHES THE PUBLISHED SITE, and it is written here
          # rather than committed. The eight historic backdrops are the National Library
          # of Scotland's own Historic Maps API layers, delivered through MapTiler, and a
          # browser-side tile request cannot be made without the key being in the page.
          #
          # So the question is not whether the key is public — it will be — but whether it
          # is also in the repository's history. It is not. A key in a public repository
          # can be rotated but never withdrawn from every clone and cache of the history;
          # a key written at deploy time is replaced by rotating the secret and running
          # this again. That is the whole reason for the step.
          #
          # WHAT ACTUALLY PROTECTS THE KEY IS THE ORIGIN RESTRICTION on it, not secrecy:
          # it is limited by Allowed HTTP Origins to https://docuracy.github.io and
          # returns 403 anywhere else, including localhost. The step above this one
          # refuses to deploy a credential found in docs/ and must keep running BEFORE
          # this, which is why this is here and not earlier.
          #
          # No secret is the normal case for a fork. The viewer hides every keyed
          # backdrop when the file is absent or empty, so it offers OpenStreetMap and the
          # three CARTO grounds rather than eight entries that can only draw blank tiles.
          # Each provider independently. A missing CARTO key must not cost the map its
          # historic layers, and a missing MapTiler key must not cost it the modern
          # grounds — the two have nothing to do with each other and an all-or-nothing
          # file would have coupled them.
          #
          # CARTO's key is what removes a watermark rather than what grants access: the
          # unkeyed tiles come back 200 with API KEY REQUIRED across them. So an absent
          # CARTO secret must HIDE those layers, not fall back to unkeyed ones.
          keys=""
          [ -n "$MAPTILER_API_KEY" ] && keys="$keys\"maptiler\":\"$MAPTILER_API_KEY\","
          [ -n "$CARTO_API_KEY" ] && keys="$keys\"carto\":\"$CARTO_API_KEY\","
          if [ -z "$keys" ]; then
            echo "::warning::Neither MAPTILER_API_KEY nor CARTO_API_KEY is set, so only"
            echo "::warning::OpenStreetMap is offered as a backdrop. The viewer hides"
            echo "::warning::keyed layers rather than listing ones that cannot draw."
            echo "::warning::This is that path, not a failure."
            exit 0
          fi
          printf '{%s}\n' "${keys%,}" > docs/viewer/keys.json
          echo "docs/viewer/keys.json written for: $(echo "${keys%,}" | grep -o '\"[a-z]*\":' | tr -d '\":' | tr '\n' ' ')"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          # Resolves from the ROOT Gemfile, which pins the github-pages gem — the same
          # Jekyll, themes and plugins GitHub's own builder used before this workflow
          # replaced it. Installing bare Jekyll built nothing, because _config.yml asks
          # for jekyll-theme-primer and the base gem does not carry it.
          #
          # Root rather than docs/ because bundler installs into vendor/bundle beside
          # the Gemfile, and inside the site source Jekyll tries to BUILD the gems.
          bundler-cache: true

      - name: Build the Jekyll site
        run: bundle exec jekyll build --source docs --destination _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
