    crs: "EPSG:27700"
    cache_path: "data/raw/os_open_map_local/"
    checksum: null
    status: verified
    notes: >
      Surface water AREAS. A watercourse is drawn as a polygon once it is wide enough to
      show, and these are the only open source of channel width in Britain. Their medial
