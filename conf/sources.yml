  - id: gb1900_raw_dump
    title: "GB1900 Gazetteer — final raw dump"
    author: "Southall, Humphrey; Aucott, Paula; and the GB1900 volunteers"
    publisher: "Great Britain Historical GIS Project, University of Portsmouth"
    year: 2018
    url: "https://www.visionofbritain.org.uk/downloads/GB1900_final_raw_dump_july_2018.zip"
    licence: "CC0 1.0 Universal (public domain dedication)"
    attribution: "GB1900 Gazetteer, Great Britain Historical GIS Project (University of
      Portsmouth), the GB1900 partners and volunteers. CC0."
    access: open
    redistribution: permitted
    used_by: docs
    stage: 2
    format: [csv]
    crs: "EPSG:4326"
    cache_path: "data/raw/gb1900/"
    # DERIVED HERE FROM THE PUBLISHER'S BYTES, 2026-09-01, not carried over. The value
    # this entry first declared — 526bc157def49e5ae9240ba029e9e53b9888b7bcc8443108e137
    # 765f5a430292 — came from the predecessor's manifest and had never been
    # re-derived. It is wrong: a fresh download from visionofbritain.org.uk and the
    # predecessor's own eleven-month-old copy are byte-identical to each other at
    # 326,329,494 bytes with all 22 members passing CRC, and both digest to the value
    # below. Two independent acquisitions agreeing against a recorded digest settle
    # which side is at fault. A wrong checksum is worse than none: it fails on a good
    # file and nobody can tell which end is broken.
    checksum: "e29eca60885b5cc896a5d3ccdfd127dea3317b2d0bf7edc84a0be629b7dc61ae"
    status: verified
    notes: >
      THE RAW DUMP, NOT EITHER GAZETTEER. Vision of Britain publishes three GB1900 files
      under two different licences. The "abridged" and "complete" GAZETTEERS are
      CC-BY-SA, whose share-alike would propagate into this project's own exports. The
      RAW DUMP is CC0 and carries no such obligation. Only the raw dump is registered
      here, and that is the whole reason. Copies of the abridged file exist on this
      machine under ~/PycharmProjects/markets and ~/Downloads; they must not be used.

      THE ABRIDGEMENT ALSO REMOVES WHAT IS WANTED. The gazetteers drop every string
      occurring 300 or more times nationally, with an exception list that is entirely
      settlement names. "Mill Race", "Mill Pond" and "Towing Path" are all far above that
      cut, so abridgement is not a size trade-off here — it is loss of the signal.

      WHAT THE RAW DUMP COSTS. It holds the individual volunteer transcriptions rather
      than a reconciled "agreed" text, so a consensus step is ours: take the reading most
      volunteers gave each pin. 8,043,297 transcriptions over 2,666,341 pins.

      NAMING: the gazetteer licence forbids calling a derived work "GB1900" or "Great
      Britain 1900". The raw dump is CC0 and carries no such term, but do not name a
      derived layer GB1900 regardless — the courtesy costs nothing.

      TLS: the server presents an incomplete certificate chain — the leaf is a valid
      Thawte certificate chaining to DigiCert Global Root G2, and only the intermediate
      is omitted. DO NOT DISABLE VERIFICATION. Supply the missing intermediate instead;
      this is tested and works:

        openssl s_client -connect www.visionofbritain.org.uk:443 \
          -servername www.visionofbritain.org.uk </dev/null | openssl x509 -out leaf.pem
        # the leaf's Authority Information Access names the missing intermediate:
        curl -sS -o i.crt http://cacerts.thawte.com/ThawteTLSRSACAG1.crt
        openssl x509 -inform DER -in i.crt -out i.pem
        cat /etc/ssl/certs/ca-certificates.crt i.pem > bundle.pem
        curl --cacert bundle.pem <url>

      A recipe is harder to get wrong than a caution.

  # NOT A STAGE 1 INPUT. Dated construction evidence, so stage 2 by
  # CLAUDE.md's first override. Its one possible Stage 1 use — earning the
  # reservoir flag of PLAN.md §5 / D-008 — is NOT claimed here, because it
  # reaches only 493 of the 24,146 `lake` links (see notes).
  - id: eidc_uk_reservoir_inventory
    title: "Inventory of reservoirs amounting to 90% of total UK storage"
    author: "Durant, M.J.; Counsell, C.J."
    publisher: "NERC Environmental Information Data Centre"
    year: 2018
    doi: "10.5285/f5a7d56c-cea0-4f00-b159-c3788a3b2b38"
    url: "https://catalogue.ceh.ac.uk/id/f5a7d56c-cea0-4f00-b159-c3788a3b2b38"
    download:
      data: "https://data-package.ceh.ac.uk/data/f5a7d56c-cea0-4f00-b159-c3788a3b2b38.zip"
      supporting: "https://data-package.ceh.ac.uk/sd/f5a7d56c-cea0-4f00-b159-c3788a3b2b38.zip"
    licence: "Open Government Licence v3.0 (SPDX ogl-uk-3.0)"
    attribution: >
      Durant, M.J.; Counsell, C.J. (2018). Inventory of reservoirs amounting to 90% of
      total UK storage. NERC Environmental Information Data Centre.
      https://doi.org/10.5285/f5a7d56c-cea0-4f00-b159-c3788a3b2b38
    access: open
    redistribution: permitted
    used_by: docs
    stage: 2
    format: [csv]
    crs: "EPSG:27700"
    cache_path: "data/raw/eidc_reservoirs/"
    checksum: null
    status: unverified
    notes: >
      LICENCE, RESOLVED THE HARD WAY. The CEH catalogue page and the DOI both return
      HTTP 500, and the download bundle's own readme.html says "Unable to retrieve
      citation and licence information for: f5a7d56c-..." — a server fault, not a
      licence. The authoritative statement is the DataCite record for the DOI, which
      carries rightsIdentifier `ogl-uk-3.0` and the citation above. data.gov.uk's
      blanket "All content is available under the Open Government Licence v3.0, except
      where otherwise stated" agrees with it but is a site footer and is not evidence
      about a particular dataset. Do not rely on the footer alone.

      WHAT IT CARRIES. 273 reservoirs; Easting/Northing on the National Grid, populated
      for all 273. Completion year for 252 (92.3%) and planning year for 240 (87.9%),
      each with its own data-quality flag column, 355 numbered references and a
      per-reservoir notes field. Set that against D-020's finding that Wikidata dates
      24 of 1,125 UK reservoirs.

      COVERAGE IS BY VOLUME, NOT BY COUNT, and the rule is explicit in the metadata:
      reservoirs over 1,600 Ml, plus smaller ones inside a group with historic storage
      information. Median entry 3,974 thousand m3; only 25 of 273 below 1,000. The small
      Victorian impoundments are therefore absent by design. 493 of the 24,146
      `lake` links in OS Open Rivers lie within 500 m of an entry, against the
      1,834 links over 606 reservoirs the scoping exercise inherited — so this earns
      roughly a quarter of that count and must never be presented as all of it.

      ENGLAND AND WALES: 233 of the 273, by Boundary-Line country polygons (England 197,
      Wales 36; Scotland 38, and 2 outside GB). Do not classify by northing — 700000 N
      lies deep inside Scotland and overcounts by 16.

      IT CONFIRMS D-020's OTHER HALF INDEPENDENTLY: none of the 6,042 named `lake`
      links contains the word "Reservoir", measured again here.

