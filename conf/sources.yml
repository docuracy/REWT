      wfs: "https://datamap.gov.wales/geoserver/ows"
      version: "2.0.0"
      type_name: "geonode:welsh_government_lidar_tile_catalogue_2020_2023"
      url_field: dtm_link          # relative; prefix https://
      srs: "EPSG:27700"
    notes: >
      Query the WFS by bounding box, read `dtm_link` from the returned feature, prefix
