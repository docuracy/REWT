# Every input is declared here before anything reads it, with its licence and the
# attribution it requires. An unregistered source is a hard error, not a warning:
# unattributed provenance is not provenance.

sources:
  - id: os_open_rivers
    title: "OS Open Rivers"
    publisher: "Ordnance Survey"
    url: "https://api.os.uk/downloads/v1/products/OpenRivers"
    api: os_downloads
    product: OpenRivers
    download:
      area: GB
      format: GeoPackage
    licence: "Open Government Licence v3 — attribution required"
    attribution: "Contains OS data © Crown Copyright and database rights 2026."
    access: open
    redistribution: permitted
    format: [geopackage]
    crs: "EPSG:27700"
    cache_path: "data/raw/os_open_rivers/"
    checksum: null
    status: unverified          # set at first acquisition, then verified on every use
    notes: >
      THE BASE NETWORK. WatercourseLink + HydroNode: roughly 144,000 km with flow
      direction, names, and ~197,000 explicit nodes — very nearly the only open British
      watercourse product carrying a topology at all.

      It is a GENERALISED cartographic derivative. It ships a network structure; it does
      not claim, and does not deliver, traversability — that the water can be followed
      from any stretch to the tide. Supplying that is Stage 1.

      Reissued twice a year. Record which issue was fetched: the network changes between
      them, and a result that cannot name its input cannot be reproduced.

  # Needed only for the water-body case in PLAN.md §5: where OS Open Rivers gives no
  # route through a lake or reservoir, the polygon's medial axis is the defensible one.
  # NOT a base network — its water has no topology at all (4% of endpoints shared,
  # 0.7% of length in a component reaching tidal water). Geometry and width only.
  - id: os_open_map_local
    title: "OS OpenMap - Local"
    publisher: "Ordnance Survey"
    url: "https://api.os.uk/downloads/v1/products/OpenMapLocal"
    api: os_downloads
    product: OpenMapLocal
    download:
      area: GB
      format: GeoPackage
    licence: "Open Government Licence v3 — attribution required"
    attribution: "Contains OS data © Crown Copyright and database rights 2026."
    access: open
    redistribution: permitted
    format: [geopackage]
    crs: "EPSG:27700"
    cache_path: "data/raw/os_open_map_local/"
    checksum: null
    status: unverified
    notes: >
      Surface water AREAS. A watercourse is drawn as a polygon once it is wide enough to
      show, and these are the only open source of channel width in Britain. Their medial
      axis follows the channel more closely than OS Open Rivers, which is generalised.

      Use for the water-body crossings only, and exclude tidal water: at estuary scale a
      "channel" is a bay and its medial axis means nothing.

  # Needed for BASINS (PLAN.md §4.1), which is what scope is decided on — a network
  # component is not a basin, because OS models the Solway Firth as connected tidal
  # water and three separate rivers land in one component. Also a weak screen on flow
  # direction (§5): 50 m posts, ~4 m RMSE, so it is mute on canals, lakes and tidal
  # reaches, which is exactly where direction is ambiguous.
  - id: os_terrain_50
    title: "OS Terrain 50"
    publisher: "Ordnance Survey"
    url: "https://api.os.uk/downloads/v1/products/Terrain50"
    api: os_downloads
    product: Terrain50
    download:
      area: GB
      format: "ASCII Grid and GML (Grid)"
    licence: "OS OpenData licence (os.uk/opendata/licence) — OGL-equivalent, attribution required"
    attribution: "Contains OS data © Crown Copyright and database rights 2026."
    access: open
    redistribution: permitted
    format: [asc, geotiff]
    crs: "EPSG:27700"
    cache_path: "data/raw/os_terrain50/"
    checksum: null
    status: unverified
    notes: >
      National 50 m DTM. Condition it (burn the network, then breach rather than fill)
      for basin delineation — but sample the UNCONDITIONED surface for any check on
      flow direction. A burned DEM has the network's own direction stamped into it and
      cannot be used to test that direction. Keep the two rasters distinctly named.

  # The England-and-Wales polygon that PLAN.md §4.1's second scope rule tests against.
