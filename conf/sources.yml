  # PER-SECTION adjudication of flow direction (PLAN.md §5). Not a national layer and
  # not a substitute for os_terrain_50, which is what gets conditioned for basins.
  # Fetch only the window you are adjudicating. Endpoint verified live 2026-08-31.
  - id: ea_lidar_composite_dtm_1m
    title: "LIDAR Composite DTM 2022 - 1m"
    publisher: "Environment Agency / Defra"
    url: "https://environment.data.gov.uk/survey"
    licence: "Open Government Licence v3"
    attribution: "© Environment Agency copyright and/or database right 2026"
    access: open
    redistribution: permitted
    format: [geotiff]
    crs: "EPSG:27700"
    cache_path: "data/raw/ea_lidar_1m/"
    checksum: null
    # NOT READ BY ANY PIPELINE STAGE, AND THAT IS THE DESIGN (D-006). LiDAR is
    # fetched per section when a person is adjudicating a place, never nationally —
    # `acquire.fetch` refuses a bulk request for it in terms. So it is a Stage 1
    # source with no batch consumer, which is a different thing from a source nothing
    # wants, and the two were indistinguishable until this field existed (D-059).
    per_section: true
    status: unverified
    wcs:
      base: "https://environment.data.gov.uk/spatialdata/lidar-composite-digital-terrain-model-dtm-1m-2022/wcs"
      version: "2.0.1"
      coverage: "13787b9a-26a4-4775-8523-806d13af58fc__Lidar_Composite_Elevation_DTM_1m"
      axis_labels: [E, N]
      extent: [80000, 4000, 656000, 665000]
      format: "image/tiff"
    notes: >
      ENGLAND ONLY, and the extent above is a bounding box, not a coverage mask: asked
      for a point in Wales the service returns a full grid of 0.0 m rather than nodata.
      Snowdonia reads 0.0 m here and 579-1055 m in the Welsh tile. Test coverage
      explicitly — never infer absence from nodata.

      Sample a window and take a low percentile, not a single cell: a point sample lands
      on a bank, a bridge deck or a building. Treat a few centimetres as no answer; the
      composite mixes flight epochs and a river surface moves with its stage.

