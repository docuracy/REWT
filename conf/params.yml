# Thresholds and parameters. AGENTS.md: these live in configuration, not as literals
# in a function. Every value here is quoted or justified by PLAN.md; where the plan
# gives a measured figure the section is named, and where it does not the choice is
# ours and is recorded in DECISIONS.md.

crs:
  working: "EPSG:27700"      # metric work throughout — buffers, distances, gradients
  export: "EPSG:27700"       # EPSG:4326 only if a consumer asks; §7 says 27700

load:
  # OS encodes flow direction relative to the digitised line. Resolve it once, here.
  # PLAN.md §5: three links in 194,471 are recorded against the digitised line.
  flow_direction_field: flow_direction
  # The values OS uses for the two senses. Anything else is a hard error.
  direction_with_line: ["inDirection", "in direction", "true"]
  direction_against_line: ["inOppositeDirection", "in opposite direction", "false"]
  # Endpoint coordinates are rounded to this many metres for joining. AGENTS.md:
  # spatial self-joins over ~120,000 links are prohibitively slow; join on rounded
  # endpoints instead. 0.001 m is far below the survey's own precision.
  endpoint_round_m: 0.001

topology:
  # "Touching but not joined": endpoints coincident within a metre sharing no node (§6).
  coincidence_tolerance_m: 1.0
  # Component size bands the census reports in (§6).
  component_bands_km: [1.0, 10.0]
  # Below this a component is a fragment for reporting purposes.
  fragment_km: 1.0

seeds:
  # A seed is a node with no outflow standing at tidal water. Taken from the survey's
  # own form, never from a coastline (§5) — a coastline decides the question by
  # distance from a modern shore and is wrong at exactly the estuaries that matter.
  form_field: form
  tidal_forms: ["tidalRiver"]
  # Seed anywhere in an in-scope basin, INCLUDING Scotland: the Border Esk's mouth is
  # in Dumfriesshire and a basin seeded only inside England and Wales strands it.
  restrict_to_england_and_wales: false

forms:
  # The four values of `form` the plan reports by. Any other value is a finding.
  expected: ["inlandRiver", "lake", "tidalRiver", "canal"]
  flat_water: ["canal", "lake"]

terrain:
  # OS Terrain 50: 50 m posts, RMSE about 4 m (§5).
  resolution_m: 50
  # The national grid is clipped at this northing. Two reasons, and the second is
  # not the important one.
  #
  # D-003 puts everything draining only to Scotland — Forth, Tay, Clyde, Spey —
  # outside the project, so delineating the Highlands is work with no consumer. The
  # most northerly basin that reaches England or Wales is the Tweed, whose head is
  # around 665000 N; England's own northern limit is about 655000 N. This leaves
  # roughly 35 km of margin above either.
  #
  # It also halves the delineation's cost, which is worth having and is all it is.
  # (An earlier note here blamed the clip for fixing a FillBurn failure. That was
  # wrong: the failure was stream geometry outside the raster extent, and the fix
  # is in rewt/stages/terrain.py where the streams are clipped to it.)
  #
  # A clip drawn by hand is an assumption, and PLAN.md §1 is explicit that an exit
  # at the edge of the study area is a defect and not a terminus. So the basins
  # stage CHECKS that no in-scope basin touches this edge, and fails if one does.
  #
  # RAISED FROM 700000 ON 2026-09-01, BY THE GUARD RATHER THAN BY ARGUMENT. The
  # original value rested on a claim that the most northerly basin reaching England
  # or Wales is the Tweed, whose head is around 665000 N. That was wrong: the
  # delineation put a 1,467 km2 basin spanning 305,650-419,900 E and reaching 700000 N
  # with 168 km2 of it in England or Wales — Solway and Cheviot border country whose
  # headwaters lie north of the cut. The basins stage refused it, which is what the
  # invariant is for, and the answer it prescribes is to move the clip rather than to
  # accept the basin.
  northing_max_m: 780000
  nominal_rmse_m: 4.0
  nodata: -9999.0
  # The screen's bands, from §5's table. A fall inside the error bar says nothing.
  screen_bands_m:
    clear_agree: 4.0
    weak: 0.5
  # Conditioning for basin delineation only. The burned raster and the raw raster are
  # kept distinctly named because sampling the burned one to check direction is
  # circular (§5, D-007).
  burn_depth_m: 20.0
  # WHICH FORMS ARE BURNED, and this is the most consequential line in this file.
  #
  # Burning `tidalRiver` destroys the delineation. OS Open Rivers models estuaries as
  # connected tidal water — PLAN.md §4.1 makes the point about network components, and
  # it is just as true of a raster — so incising those 5,738 km carves a continuous
  # channel along the coast that joins one river mouth to the next. Measured: with
  # tidal links burned, ONE basin held 181,672 km2, 88% of the land, spanning
  # 110,000-659,950 E and 10,050-700,000 N, while the median basin was 0.1 km2. **A
  # shared estuary is not a shared catchment**, and burning tidal water is how you tell
  # the DEM that it is — which defeats the one job the DEM was acquired for.
  #
  # `canal` is excluded for the same reason from the other direction: canals cross
  # watersheds by design (D-011), so a burned summit pound joins two basins that the
  # terrain separates. Excluding canals from the BURN does not exclude them from the
  # network or from the reachability requirement; D-011 stands. It says only that the
  # terrain is not carved along an artificial cut when deciding where water would
  # naturally go.
  burn_forms: [inlandRiver, lake]
  # The least-cost breach's search radius, in cells. 10 cells at 50 m is 500 m, and
  # the cost of this parameter is quadratic and steep. Measured on the burned national
  # surface, single-threaded:
  #
  #   dist=10   431 s,  99.86% of land cells at a plausible elevation
  #   dist=20   still running at 6 minutes of CPU
  #   dist=100  ABANDONED, unfinished after 70 minutes of CPU
  #   dist=500  ABANDONED, unfinished after 20 minutes of CPU (the first value tried)
  #
  # `fill: true` in the stage floods whatever cannot be carved within the radius, so a
  # small radius costs completeness nothing: it changes which depressions are carved
  # and which are flooded, not whether they are resolved. PLAN.md §5 asks to carve
  # first, and this carves first out to 500 m.
  #
  # Two alternatives were measured and both are unusable, which is why this stays a
  # least-cost breach rather than something faster. Complete breaching
  # (`breach_depressions`, unbounded) takes 81 s and carves to -19,747 m, cutting 13%
  # of land by more than a metre. Bounded breaching (max_depth 50 m, max_length 200,
  # fill_pits) takes 380 s and returns a median land elevation of 2,272 m, which is
  # nonsense for a country whose highest ground is 1,345 m.
  breach_max_dist_cells: 10
  # How far below the lowest land cell the sea is written in. Terrain 50 masks the sea
  # out, and a masked cell is a WALL — WhiteboxTools will not route flow into nodata —
  # so without this the water cannot leave the land at all and the conditioning pools
  # the whole country into its lowest hollow. It needs only to be unambiguously below
  # everything; the value is not a depth and means nothing physical.
  sea_depth_below_land_m: 100.0
  # How wide a margin of sea is given that elevation. The sea must be an outlet at the
  # coast and nowhere else; writing in all 102 million sea cells more than doubles the
  # conditioning's work and took breaching from seven minutes to over thirty. Ten cells
  # is 500 m, which is wider than the coastline's own generalisation.
  sea_margin_cells: 10
  # Sea is masked out of Terrain 50; a node on nodata is confirmation of tidal water,
  # not a missing sample (§6).
  sea_is_nodata: true

basins:
  # Delineation is over the conditioned surface. The stream threshold decides how many
  # basins come out; it is a reporting granularity, not a hydrological claim.
  flow_accumulation_cells: 400        # 400 * 50 m * 50 m = 1 km^2
  # A river mouth from OS Open Rivers is a node on a generalised line and need not sit
  # on the 50 m grid's own channel. Snap it to the largest flow accumulation within
  # this radius, or the catchment delineated from it is a sliver beside the river.
  pour_point_snap_m: 500.0
  min_basin_area_km2: 1.0
  # PLAN.md §4.1 calibration for the provisional scope: 122,104 links kept,
  # 72,367 excluded, over a Great Britain network.
  calibration:
    links_in_scope: 122104
    links_out_of_scope: 72367
    length_in_scope_km: 101875
    length_out_of_scope_km: 50851

scope:
  # Two rules (§4.1). A link is in scope if its downstream end falls in an in-scope
  # basin, OR if it falls in England or Wales. The second is not a fudge: tidal water
  # is masked out of the DEM and so sits on no basin at all.
  countries_in_scope: ["England", "Wales"]
  # A basin is in scope if any part of it lies in England or Wales — but a sliver of
  # overlap from boundary generalisation is not "any part". Require this much.
  min_overlap_area_km2: 1.0
  # Named cross-border cases the definition of done asks to be listed individually.
  expected_cross_border: ["Tweed", "Esk", "Eden", "Dee", "Severn", "Wye"]

lidar:
  # Per section only, never nationally (D-006). Sample a window and take a low
  # percentile: a point sample lands on a bank, a bridge deck or a building (§5).
  window_m: 80
  percentile: 10
  # Treat a fall of a few centimetres as no answer: the composite mixes flight epochs
  # and a river's surface moves with its stage.
  no_answer_m: 0.05
  # The English service returns ZEROS over Wales, not nodata. Test coverage
  # explicitly; never infer it from nodata (§5).
  england_zero_guard: true
  zero_guard_fraction: 0.98    # a window this flat at exactly 0.0 m is absence
  request_timeout_s: 60
  cache: true

repair:
  # A connector is defined by its geometry, not by a link id: each end is resolved onto
  # the network, cutting a link where there is no node. Snapping to the nearest node
  # left connectors attached to nothing 280 m and 377 m away (§5).
  connector_snap_node_m: 1.0        # only this close does an end reuse an existing node
  connector_split_link_m: 10.0      # beyond this an end resolves onto no link: an error
  # A junction adds no geometry at all: the target is cut and the node merged.
  junction_max_offset_m: 10.0
  # Order matters (§5): corrections applied before their targets exist are skipped
  # silently. Every skip is named by identifier.
  fail_on_unresolved: true

connectors:
  # A CONNECTOR THAT RISES IS WATER RUNNING UPHILL. The rule that proposes them joins a
  # stranded region to the nearest water that already drains, and until v0.1.0-alpha it
  # consulted only distance: 104 of 1,204 connectors rose more than a metre end to end,
  # 23 rose more than five, and the worst climbed 27.4 m over 462 m. Those are joins
  # across an embankment or a watershed, chosen because two channels happened to be
  # close in plan. Found by Stephen looking at two of them on the map.
  #
  # The tolerance is the terrain model's noise, not a preference. Terrain 50 is a 50 m
  # grid: over a few hundred metres of flat coast a metre of apparent rise means
  # nothing, and rejecting on it would refuse good joins in the Fens and the Levels
  # where most of this work is. Two metres is the observed 5th percentile of the fall
  # distribution, so it is where real signal starts rather than a round number.
  max_rise_m: 2.0
  # A SURVEYED STRUCTURE OUTRANKS A 50 m MODEL. Where the Canal & River Trust records a
  # lock, an aqueduct, a culvert or a weir this close to a connector that the terrain
  # says climbs, something was built at that place to move water across it, and the
  # register is better evidence than a grid whose cell is fifty metres wide.
  #
  # It is corroboration overriding a measurement, not a loosened threshold: `max_rise_m`
  # keeps its value and its meaning, and a connector with no structure near it is still
  # refused however slightly it climbs. The same rule already lets a person's judgement
  # override the terrain, and a structure is the better warrant of the two — it was
  # surveyed, and a recollection was not.
  #
  # 150 m is the radius the audit already uses to corroborate a refused 0 m crossing
  # against the same register, so the two tests agree about what "at this place" means.
  structure_corroboration_m: 150.0
  # How many approaches to consider before giving up on finding a downhill one. The
  # nearest is tried first and a longer candidate is taken only to avoid climbing, so
  # this widens the search rather than loosening it.
  candidates: 12

canals:
  # §5's measured bands for canal-only components and their nearest non-canal
  # watercourse. Reported so the shape of the work is visible before it is done.
  nearest_bands_m: [10.0, 50.0, 200.0, 2000.0]

water_bodies:
  # Skeletonise only where it earns its place (§5): where the survey gives no route,
  # or where a schematic line is doing real routing work.
  min_polygon_area_m2: 10000.0
  exclude_tidal: true              # width can measure the sea
  medial_axis_interval_m: 25.0

audit:
  # The audit is part of the build and fails loudly (§2, §6).
  fail_build_on_defects: false     # set true once the exit condition is met
  # A defect this small is nominal (§1: "no node carries more than a nominal
  # catchment draining into nowhere").
  nominal_upstream_km: 0.5
  report_top_n: 50

determinism:
  seed: 20260831
  # Deterministic ordering wherever a result depends on iteration order (§2).
  order_by: publisher_id

sea:
  # §10's sea terminus. The construction stipulates a COST SURFACE and lets the route
  # emerge, so these are the only numbers chosen by us rather than measured — which is
  # why each states what would make it wrong.

  # Depth below Lowest Astronomical Tide at which a cell becomes passable.
  #
  # NOT a vessel's draught, and the distinction is what keeps this stage dateless: a
  # draught implies a hull implies a period. This is a margin against the grid and the
  # survey. A cell's value is an average over its footprint and hides shallower ground
  # inside it, and the bathymetry carries its own vertical uncertainty. Below LAT is
  # permanently submerged by definition, so 0.0 would already be defensible; the margin
  # is for the two errors above and nothing else.
  #
  # MEASURED, having first been guessed. 5.0 was chosen before any evidence and cost
  # a great deal: the share of mouths with any open water within 5 km of them runs
  #
  #     clearance   0 m    1 m    2 m    5 m    10 m
  #     termini    76.0%  67.5%  63.8%  56.0%  48.6%
  #     orphans    96.2%  92.8%  92.2%  88.1%  80.3%
  #
  # while the passable area itself moves only 1.6% between 0 and 5 m. The cells that
  # differ ARE the coastal fringe, so the parameter was not trimming the sea, it was
  # severing mouths from it — around the Wash, the Humber, Morecambe Bay and most of
  # the southern North Sea, water 5 m below LAT lies kilometres offshore.
  #
  # 2.0 m keeps a real margin for the 100 m cell averaging and the survey's own vertical
  # uncertainty, while stranding 4 in 100 fewer mouths than 5.0 did. It is not 0.0,
  # which would admit water a hand's depth below the lowest tide and claim the margin
  # this parameter exists to provide.
  # Wrong if: the passable surface fragments around Britain at this value, or if raising
  # it to 10 m changes the trunk's course rather than only its edges.
  clearance_m: 2.0

  # Working resolution of the sea grid, and the resampling that goes with it.
  #
  # 100 m is close to the source's own 3.75 arcsec (about 115 m N-S at these latitudes),
  # so the grid neither invents detail nor aggregates it away: 94 million cells, against
  # 206 million for the land at 50 m.
  #
  # RESAMPLE BY AVERAGE, NOT BY MAX. Max — the shallowest point in each cell — looks like
  # the conservative choice and is the wrong one: a 100 m cell holding one rock and
  # 9,900 m2 of deep water is still connected water, and taking the rock erodes every
  # channel until the coast is a wall. Measured: under max the Solent closed. That also
  # settles the clearance parameter's justification, which is a margin against the cell
  # AVERAGING over its footprint — true of average and not of max.
  #
  # Wrong if: a channel known to carry deep water closes. **The Solent is the control**
  # and it stays open at 100 m and at 200 m — the Isle of Wight is a separate land mass
  # in the passable surface, which is the test stated topologically so that it needs no
  # coordinate precision.
  #
  # NOT the Menai Strait, which an earlier version of this comment named. It closes at
  # both resolutions, and it SHOULD: the Swellies are rock and shallows that nearly dry,
  # so a surface of water 5 m below LAT excludes them correctly. A falsification test has
  # to be something that would only fail if the method were wrong.
  cell_m: 100.0

  # A cell joins the trunk when this share of all tidal termini route through it.
  # Stated as a SHARE so it does not need revisiting when the terminus count changes.
  #
  # §10 forbids the obvious abuse: if no continuous trunk emerges, that is a finding
  # about the bathymetry and must be reported. Lowering this until a line appears
  # manufactures the result the parameter was supposed to test for.
  trunk_share: 0.01

  # The window bathymetry is fetched over, in WGS84 degrees [west, south, east, north].
  # Great Britain plus enough sea for a coastal route to have somewhere to run. Not the
  # deep Atlantic: the construction connects mouths to each other, so water far offshore
  # is never on a route between two of them and only costs time to fetch.
  # Wrong if: a terminus in Shetland or the Isles of Scilly falls outside it.
  # HOW CLOSE TO MEAN HIGH WATER A BLOCKED MOUTH MUST BE TO REACH THE SEA DIRECTLY.
  # A channel ending at the sea wall discharges through it; one ending well inland is
  # drained by the network, and attaching it to a §10 route would show the water leaving
  # where it does not. 100 m is a knee rather than a preference: 76% of blocked mouths
  # lie within it, the next 150 m add only 27 more, and it sits between the 43 m that
  # should attach and the 210 m that should not.
  max_coast_m: 100.0
  extent_wgs84: [-8.0, 49.5, 2.0, 61.0]
  # Fetched in windows this many degrees square and mosaicked. The service serves one
  # seamless coverage, so this is only about request size.
  window_deg: 1.0

  # Depth at which water stops being penalised. A cell of exactly `clearance_m` costs
  # deep_reference_m / clearance_m times a cell of open water — 10x at the values here —
  # so the path trades distance against depth rather than simply hugging the deepest
  # line at any length. That trade is what "deepest AVAILABLE channel" means: the
  # deepest water that is not an absurd detour.
  # Wrong if: routes visibly prefer open ocean to the obvious coastal channel, which
  # means the penalty is too weak; or hug soundings through evident dead ends, too strong.
  deep_reference_m: 50.0

  # How far a mouth may be from qualifying water and still be attached to the sea.
  #
  # It bridges the gap between where the survey stops drawing and where navigable
  # depth begins, which §10 asks the sea network to do: OS Open Rivers draws linear
  # watercourses, so the Humber estuary below Trent Falls, the Solway, the Tay and the
  # Cree are simply absent from it — real water carrying real rivers to the sea, with
  # no link to stand for it.
  #
  # MEASURED, and there is a knee. Share of the in-scope network that reaches the sea
  # when tested, against the radius allowed:
  #
  #     radius   5 km    10 km   15 km   20 km   30 km   50 km
  #     share   69.50%  71.55%  88.18%  88.19%  88.20%  88.88%
  #
  # The 16.6 points between 10 and 15 km are almost entirely the Humber, whose
  # terminus sits about 12 km from the nearest qualifying water and carries 13,348 km
  # of network behind it. Past 15 km the curve is flat: tripling the radius to 50 km
  # buys 0.7 points, and every kilometre added past the knee is a kilometre in which a
  # genuinely inland dead end might be joined to a sea it does not reach.
  #
  # Wrong if: raising it to 30 km moves the published share by more than a rounding.
  snap_radius_km: 15.0

  # A path longer than this is refused rather than drawn. A least-cost path will cross
  # an unsurveyed hole and produce a confident track through water nobody has measured;
  # refusing is a finding, drawing it is a fabrication.
  max_path_km: 150.0
